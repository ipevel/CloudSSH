name: Sync upstream

on:
  schedule:
    # Runs daily at 04:20 Asia/Shanghai (20:20 UTC).
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # gh workflow run 需要 actions: write 才能显式派发部署工作流。
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    # Run only in forks. Scheduled sync is opt-in;
    # manual dispatch remains available without setting the repository variable.
    if: >-
      github.event.repository.fork == true &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_SYNC_UPSTREAM == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sync main branch from upstream
        env:
          # merge-upstream 在服务端写入 .github/workflows/ 下的文件；GITHUB_TOKEN
          # 属于 GitHub App 身份，即使 permissions 声明也无法获得 workflows 写权限，
          # 故改用具备 workflow scope 的仓库 secret。
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if ! response=$(gh api \
            --method POST \
            "repos/${REPOSITORY}/merge-upstream" \
            -f branch=main 2>"$error_file"); then
            cat "$error_file" >&2
            echo "::error title=上游同步失败::GitHub 无法同步 main 分支，请检查分支冲突或仓库权限。"
            {
              echo "## 上游同步结果"
              echo
              echo "- 状态：同步失败"
              echo "- 建议：检查分支冲突或仓库权限"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ -s "$error_file" ]]; then
            cat "$error_file" >&2
          fi
          rm -f "$error_file"
          trap - EXIT

          merge_type=$(jq -r '.merge_type // "unknown"' <<< "$response")
          base_branch=$(jq -r '.base_branch // "unknown"' <<< "$response")
          detail=""

          case "$merge_type" in
            none)
              result="当前 main 分支未落后于上游，无需同步"
              ;;
            fast-forward)
              result="已成功同步上游更新"
              detail="合并方式：fast-forward"
              ;;
            merge)
              result="已成功同步上游更新"
              detail="合并方式：merge"
              ;;
            *)
              result="GitHub 已完成同步请求"
              detail="合并方式：${merge_type}"
              ;;
          esac

          echo "上游分支：${base_branch}"
          echo "同步结果：${result}"
          if [[ -n "$detail" ]]; then
            echo "$detail"
          fi
          echo "::notice title=上游同步::${result}"

          {
            echo "## 上游同步结果"
            echo
            echo "- 上游分支：\`${base_branch}\`"
            echo "- 状态：${result}"
            if [[ -n "$detail" ]]; then
              echo "- ${detail}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 由 GITHUB_TOKEN 发起的 push 不会再次触发 workflow 运行，merge-upstream 写入的提交
          # 因此不会自动启动 deploy.yml；同步真正产生变更后必须显式派发一次部署。
          # 只要存在上游变更就派发部署，不对 merge_type 做取值白名单：
          # 未来新增的合并方式同样需要触发部署，避免再次漏部署。
          if [[ "$merge_type" != "none" ]]; then
            if gh workflow run deploy.yml --ref main; then
              echo "已派发部署工作流：deploy.yml（ref=main）"
              echo "- 部署：已派发 \`deploy.yml\`（ref: \`main\`）" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::部署派发失败：本次同步已成功，但 deploy.yml 未能派发，请手动运行部署工作流。"
              echo "- 部署：派发 \`deploy.yml\` 失败，请手动运行" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- 部署：本次无上游更新，未派发部署" >> "$GITHUB_STEP_SUMMARY"
          fi
