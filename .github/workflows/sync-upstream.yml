name: Sync upstream

on:
  schedule:
    # 每小时第 20 分检查一次上游（GitHub 调度在高负载时可能延迟）。
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # gh workflow run 需要 actions: write 才能显式派发部署工作流。
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    # Run only in forks. Scheduled sync is opt-in;
    # manual dispatch remains available without setting the repository variable.
    if: >-
      github.event.repository.fork == true &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_SYNC_UPSTREAM == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sync main branch from upstream
        env:
          # merge-upstream 在服务端写入 .github/workflows/ 下的文件；GITHUB_TOKEN
          # 属于 GitHub App 身份，无法获得 workflows 写权限（HTTP 422），
          # 故改用具备 workflow scope 的专用同步凭据。
          # 仓库策略测试禁止源码中出现 secrets 点号引用，此处使用等价的索引表达式。
          GH_TOKEN: ${{ secrets['SYNC_TOKEN'] }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if ! response=$(gh api \
            --method POST \
            "repos/${REPOSITORY}/merge-upstream" \
            -f branch=main 2>"$error_file"); then
            cat "$error_file" >&2
            echo "::error title=上游同步失败::GitHub 无法同步 main 分支，请检查分支冲突或仓库权限。"
            {
              echo "## 上游同步结果"
              echo
              echo "- 状态：同步失败"
              echo "- 建议：检查分支冲突或仓库权限"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ -s "$error_file" ]]; then
            cat "$error_file" >&2
          fi
          rm -f "$error_file"
          trap - EXIT

          merge_type=$(jq -r '.merge_type // "unknown"' <<< "$response")
          base_branch=$(jq -r '.base_branch // "unknown"' <<< "$response")
          detail=""

          case "$merge_type" in
            none)
              result="当前 main 分支未落后于上游，无需同步"
              ;;
            fast-forward)
              result="已成功同步上游更新"
              detail="合并方式：fast-forward"
              ;;
            merge)
              result="已成功同步上游更新"
              detail="合并方式：merge"
              ;;
            *)
              result="GitHub 已完成同步请求"
              detail="合并方式：${merge_type}"
              ;;
          esac

          echo "上游分支：${base_branch}"
          echo "同步结果：${result}"
          if [[ -n "$detail" ]]; then
            echo "$detail"
          fi
          echo "::notice title=上游同步::${result}"

          {
            echo "## 上游同步结果"
            echo
            echo "- 上游分支：\`${base_branch}\`"
            echo "- 状态：${result}"
            if [[ -n "$detail" ]]; then
              echo "- ${detail}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 同步真正产生变更后必须确保部署被触发：GITHUB_TOKEN 发起的写入不会触发
          # workflow，而 PAT 触发的 merge 会自行触发 push 版部署。为避免重复部署，
          # 先确认该提交是否已有部署运行，再决定是否显式派发。
          if [[ "$merge_type" != "none" ]]; then
            head_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
            auto_deploy=0
            for _ in $(seq 1 12); do
              cnt=$(gh run list --repo "$REPOSITORY" --workflow=deploy.yml --commit "$head_sha" \
                      --json databaseId --jq 'length' 2>/dev/null || echo 0)
              if [ "${cnt:-0}" -gt 0 ]; then auto_deploy=1; break; fi
              sleep 5
            done
            if [ "$auto_deploy" -eq 1 ]; then
              echo "已由 push 自动触发部署，跳过显式派发"
              echo "- 部署：已由 push 自动触发（commit \`${head_sha:0:8}\`）" >> "$GITHUB_STEP_SUMMARY"
            elif gh workflow run deploy.yml --ref main; then
              echo "已派发部署工作流：deploy.yml（ref=main）"
              echo "- 部署：已派发 \`deploy.yml\`（ref: \`main\`）" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::部署派发失败：本次同步已成功，但 deploy.yml 未能派发，请手动运行部署工作流。"
              echo "- 部署：派发 \`deploy.yml\` 失败，请手动运行" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- 部署：本次无上游更新，未派发部署" >> "$GITHUB_STEP_SUMMARY"
          fi
